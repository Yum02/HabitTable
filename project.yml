# XcodeGen 설정 — CI(GitHub Actions)에서 HabitTable.xcodeproj를 자동 생성합니다.
# Mac에서 직접 열 때도: brew install xcodegen && xcodegen generate
name: HabitTable
options:
  bundleIdPrefix: com.habittable
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HabitTable:
    type: application
    platform: iOS
    sources: [HabitTable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habittable.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Habit Table
        CODE_SIGNING_ALLOWED: NO
  HabitTableTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HabitTableTests]
    dependencies:
      - target: HabitTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habittable.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  HabitTable:
    build:
      targets:
        HabitTable: all
    test:
      targets: [HabitTableTests]
